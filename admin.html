<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lommepenge – Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <a href="Lommepenge.html" class="back-link">← Lommepenge</a>

    <section id="loginSection" hidden>
      <h1>Log ind</h1>
      <p class="subtitle">Kun for forældre</p>
      <div class="card">
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>
          </div>
          <div class="field">
            <label for="password">Adgangskode</label>
            <input type="password" id="password" name="password" required>
          </div>
          <button type="submit">Log ind</button>
          <p class="error-message" id="loginError"></p>
        </form>
      </div>
    </section>

    <section id="adminSection" hidden>
      <div class="top-bar">
        <h1 style="margin:0">Admin</h1>
        <button id="logoutButton" type="button">Log ud</button>
      </div>

      <div class="card">
        <p class="section-title" style="margin-top:0">Tilføj bevægelse</p>
        <form id="txForm">
          <div class="field">
            <label for="childSelect">Barn</label>
            <select id="childSelect" name="childSlug" required></select>
          </div>
          <div class="field">
            <label for="accountSelect">Konto</label>
            <select id="accountSelect" name="accountType" required>
              <option value="lommepenge">Lommepenge</option>
              <option value="toejpenge">Tøjpenge</option>
            </select>
          </div>
          <div class="field">
            <label>Type</label>
            <div class="radio-group">
              <label><input type="radio" name="direction" value="in" checked> Sæt penge ind</label>
              <label><input type="radio" name="direction" value="out"> Træk penge ud</label>
            </div>
          </div>
          <div class="field">
            <label for="amount">Beløb (kr)</label>
            <input type="number" id="amount" name="amount" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label for="note">Note</label>
            <input type="text" id="note" name="note" placeholder="F.eks. Ugentlig lommepenge, Legetøj i Bilka..." maxlength="200">
          </div>
          <button type="submit">Tilføj</button>
          <p class="error-message" id="txError"></p>
        </form>
      </div>

      <div id="childrenOverview"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/format.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
